website_path = "/it"
footer = "Sempre aperto a una chiacchierata su Rust, sistemi di dati e software ben progettato."

[about]
title = "Chi sono"
body = """
Sono uno sviluppatore software di Bologna. Dal {{ since_year }} costruisco software frontend e full-stack in **{{ company }}**,
dove il mio strumento quotidiano è **Angular**: tengo alla correttezza, a modelli dati espliciti e a codice noioso da mantenere.

Mi sto spostando verso il **Data Engineering**, ed è lì che uso **Rust**: ingestione, modellazione dei dati, orchestrazione e l'infrastruttura che trasforma dati grezzi in qualcosa di affidabile.
[aria-er](https://github.com/{{ github_user }}/aria-er) è dove lo metto in pratica, da capo a fondo.

In parallelo studio part-time per la **Laurea in Ingegneria Informatica** all'Università di Bologna."""

[now]
title = "Ora"
items = [
  "Pipeline dati in Rust, storage Parquet partizionato e modelli dbt",
  "Orchestrazione DAG e data quality testing con Dagster",
  "Architettura backend modulare per **your-finance** (Axum, PostgreSQL con RLS)",
  "Sviluppo frontend con Angular e containerizzazione degli ambienti",
]

[next]
title = "Prossimi passi"
items = [
  "Dashboard Streamlit e deploy completo su GCP per aria-er",
  "SQL avanzato e modellazione dei dati",
  "Data warehouse in cloud e infrastructure as code",
]

[featured]
title = "Progetto in evidenza"
body = "**aria-er** trasforma le misure frammentate della qualità dell'aria di ARPAE Emilia-Romagna in un dataset unico e testato: superamenti dei limiti di legge, andamento degli inquinanti, correlazione con il meteo."

